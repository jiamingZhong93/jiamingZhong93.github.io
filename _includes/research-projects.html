<div class="research-projects">
{% for project in site.data.research.projects %}
<article id="{{ project.id }}" class="research-project{% if project.image %} has-media{% else %} text-project{% endif %}">
{% if project.image %}<a class="project-media media-link" href="{{ project.image }}" aria-label="View {{ project.title }} research figure"><img src="{{ project.image }}" alt="{{ project.image_alt | escape }}" loading="lazy" width="560" height="370"></a>{% endif %}
<div class="project-body"><p class="project-context"><span class="project-number">0{{ forloop.index }}</span> {{ project.context }}</p><h3>{{ project.title }}</h3><p>{{ project.description }}</p><div class="project-links">{% for link in project.links %}<a href="{{ link.url }}">{{ link.label }} <span aria-hidden="true">↗</span></a>{% endfor %}{% if project.video_url %}<a href="{{ project.video_url }}">Video <span aria-hidden="true">↗</span></a>{% endif %}</div></div>
</article>
{% endfor %}
</div>
