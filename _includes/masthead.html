<a class="skip-link" href="#main" data-zh="跳至正文">Skip to content</a>
<header class="masthead"><div class="masthead__inner-wrap"><div class="masthead__menu">
<nav id="profile-nav" class="profile-nav" aria-label="Main navigation" data-zh-aria-label="主导航">
<button type="button" class="profile-nav__toggle" aria-expanded="false" aria-controls="profile-nav-links" hidden><span data-current-section>Home</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5" /></svg></button>
<ul class="profile-nav__links" id="profile-nav-links">
{% for link in site.data.navigation.main %}<li><a href="{{ link.url }}" data-nav-en="{{ link.title | escape }}" data-nav-zh="{{ link.title_zh | default: link.title | escape }}" data-zh="{{ link.title_zh | default: link.title | escape }}">{{ link.title }}</a></li>{% endfor %}
</ul>
</nav><select id="site-language" class="language-select" aria-label="Language / 语言"><option value="en" selected>English</option><option value="zh-CN">中文</option></select></div></div></header>
