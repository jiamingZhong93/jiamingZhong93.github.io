{% assign trajectory = site.data.trajectory %}
<figure class="research-trajectory">
<figcaption>
<span class="trajectory-heading" data-zh="{{ trajectory.title_zh | default: trajectory.title | escape }}">{{ trajectory.title | escape }}</span>
</figcaption>
<ol class="trajectory-list" role="list">
{% for step in trajectory.steps %}
<li id="trajectory-{{ step.id | escape }}">
<span data-zh="{{ step.title_zh | default: step.title | escape }}">{{ step.title | escape }}</span>
{% unless forloop.last %}<span class="trajectory-arrow" aria-hidden="true">→</span>{% endunless %}
</li>
{% endfor %}
</ol>
</figure>
