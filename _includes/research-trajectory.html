{% assign trajectory = site.data.trajectory %}
<figure class="research-trajectory">
<figcaption><h2 class="home-subheading trajectory-heading" data-zh="{{ trajectory.title_zh | default: trajectory.title | escape }}">{{ trajectory.title | escape }}</h2></figcaption>
<ol class="trajectory-map" role="list">
{% for phase in trajectory.phases %}
<li class="trajectory-phase">
{% assign stage = trajectory.stages[phase.stage] %}
{% if stage %}<p class="trajectory-stage" data-zh="{{ stage.title_zh | default: stage.title | escape }}">{{ stage.title | escape }}</p>{% endif %}
<div class="trajectory-track" aria-hidden="true">
<div class="trajectory-motif" aria-hidden="true">
<svg viewBox="0 0 28 28" fill="none" focusable="false">
{% case phase.id %}
{% when 'dynamics' %}<path d="M3 19c4 0 3-11 7-11s3 12 7 12 4-10 8-10"/><path class="motif-guide" d="M3 22h22"/>
{% when 'interactions' %}<path d="m7 8 14 3-9 11-5-14Z" class="motif-guide"/><circle cx="7" cy="8" r="3"/><circle cx="21" cy="11" r="3"/><circle cx="12" cy="22" r="3"/>
{% when 'decisions' %}<path d="M14 8v5m0 0-8 7m8-7 8 7"/><circle cx="14" cy="5" r="3"/><circle cx="6" cy="22" r="2"/><circle cx="22" cy="22" r="2"/><path class="motif-guide" d="M4 13h5m10 0h5"/>
{% when 'imitation' %}<path d="m3 11 5-5 6 7 5-4 6-6"/><path class="motif-guide" d="m3 22 5-5 6 7 5-4 6-6"/>
{% when 'reinforcement' %}<path d="M22 8a10 10 0 1 0 2 11M22 3v6h-6"/><path d="m9 14 4 4 8-9" class="motif-guide"/>
{% when 'manipulation' %}<path d="M5 22h18M9 22v-6l6-5 5 3M15 11l-2-6 5-2M20 14l3-3M20 14l3 3"/><circle cx="9" cy="16" r="2"/><circle cx="15" cy="11" r="2"/>
{% else %}<path d="M4 14h20m-6-6 6 6-6 6"/>
{% endcase %}
</svg>
</div>
</div>
<h3 class="trajectory-theme" data-zh="{{ phase.title_zh | default: phase.title | escape }}">{{ phase.title | escape }}</h3>
<ol class="trajectory-methods" role="list">
{% for step in phase.steps %}
<li id="trajectory-{{ step.id | escape }}"><span data-zh="{{ step.title_zh | default: step.title | escape }}">{{ step.title | escape }}</span></li>
{% endfor %}
</ol>
</li>
{% endfor %}
</ol>
</figure>
{% if trajectory.outlook %}<p class="trajectory-outlook" data-zh="{{ trajectory.outlook_zh | default: trajectory.outlook | escape }}">{{ trajectory.outlook | escape }}</p>{% endif %}
{% if trajectory.applications %}
<ul class="trajectory-applications">
{% for application in trajectory.applications %}<li data-zh="{{ application.text_zh | default: application.text | escape }}">{{ application.text | escape }}</li>{% endfor %}
</ul>
{% endif %}
