vision:
  title: Trustworthy Physical AI
  title_zh: 可信物理人工智能
  learning: Data-driven learning
  learning_zh: 数据驱动学习
  prior: Model-based prior
  prior_zh: 基于模型的先验
  description: "My research focuses on hybrid data-driven and model-based priors that formally embed AI within classic models, human preferences, and safety-critical architectures. Data-driven learning improves intelligence and adaptability under uncertainty, while structured schemes incorporate human knowledge as priors and enforce safety, stability, and robustness. My long-term goal is to build trustworthy Physical AI that transfers knowledge across tasks and environments, with verifiable safety and reliability."
  description_zh: "我的研究聚焦于数据驱动方法与模型先验的融合，以形式化方式将人工智能与经典模型、人类偏好及安全关键架构相结合。数据驱动学习提升系统在不确定环境下的智能水平与适应能力，结构化方法则将人类知识作为先验，保障安全、稳定与鲁棒。我的长期目标是构建可信物理人工智能，使自主系统能够跨任务、跨环境迁移知识，并具备可验证的安全性与可靠性。"
  bullets:
    - text: "How can multimodal learning capture the dynamics and interactions of our complex physical world?"
      text_zh: "多模态学习如何刻画复杂物理世界中的动力学与交互关系？"
    - text: "How can action-conditioned predictive world models support downstream optimization-based tasks?"
      text_zh: "以动作为条件的预测性世界模型如何支撑下游基于优化的任务？"
    - text: "How can imitation, reinforcement, and self-supervised learning be formally integrated with classic schemes?"
      text_zh: "如何实现模仿学习、强化学习、自监督学习与经典方法的形式化融合？"

projects:
  # Optional image_size: [original width, height]; image_crop: [x, y, width, height].
  # Crops are in original pixels and trim only outer padding in the page, not the file.
  # 可选：image_size 为原图宽高；image_crop 为 [左上角 x, y, 裁切宽, 高]，单位为原图像素。
  - id: articulated-vehicles
    title: Learning-based planning and control for articulated heavy-duty and off-road vehicles
    description: "Ongoing research on **Transformer-based imitation learning** and **reinforcement-learning-enhanced MPC** for articulated heavy-duty and off-road vehicles under complex vehicle–terrain interactions. The SafeTrucks project combines vehicle dynamics, road weather, friction information, and AI to improve heavy-vehicle safety."
    image: /images/research/safetrucks-snow.jpg
    image_size: [1121, 510]
    image_alt: An articulated truck driving on a snow-covered forest road, from the SafeTrucks website.
    image_alt_zh: SafeTrucks 官网照片：铰接式卡车行驶在积雪覆盖的林间道路上。
    # Public photo and description: https://safetrucks.fmi.fi/index.php/project-description/
    # Original image: https://safetrucks.fmi.fi/wp-content/uploads/2023/08/rekka2.jpg
    links:
      - label: SafeTrucks project
        url: https://safetrucks.fmi.fi/index.php/project-description/
    title_zh: 基于学习的铰接式重型及越野车辆规划与控制
    description_zh: "面向复杂车辆—地形交互下的铰接式重型及越野车辆，正在探索**基于 Transformer 的模仿学习**与**强化学习增强的模型预测控制（MPC）**。SafeTrucks 项目结合车辆动力学、道路气象、摩擦信息与人工智能，提升重型车辆的行驶安全性。"
  - id: drivellm
    title: "DriveLLM: Explainable Decision-Making for Autonomous Driving"
    image: /images/research/drivellm.png
    image_size: [1283, 1049]
    image_crop: [19, 0, 1245, 1019]
    image_alt: WATonobus and driving scenes with pedestrians, snow, and LiDAR sensing from the DriveLLM research overview.
    description: "Integrating **large language models (LLMs)** with autonomous driving stacks for commonsense reasoning and explainable decisions. **Driving-specific fine-tuning** and **cyber-physical feedback** help address unfamiliar scenarios and human instructions, with real-world WATonobus case studies."
    links:
      - label: Paper · IEEE T-IV
        url: https://ieeexplore.ieee.org/document/10297415
      - label: Project
        url: https://github.com/DriveLLM/DriveLLM
    title_zh: "DriveLLM：面向自动驾驶的可解释决策"
    description_zh: "将**大语言模型（LLMs）** 融入自动驾驶软件栈，实现常识推理与可解释决策。结合**面向驾驶场景的模型微调**与**信息物理反馈**，探索对陌生场景和人类指令的应对，并开展 WATonobus 实车案例研究。"
    image_alt_zh: DriveLLM 研究概览中的 WATonobus，以及涉及行人、积雪和激光雷达感知的驾驶场景。
  # Official project page and unmodified figure; CoInfra is an ongoing preprint project.
  # Image source: https://raw.githubusercontent.com/NingMingHao/CoInfra/main/assets/DatasetExample.jpg
  - id: coinfra
    title: "CoInfra: Cooperative Perception in Adverse Weather"
    title_zh: CoInfra：恶劣天气下的车路协同感知
    description: "Cooperative camera–LiDAR perception with shared **bird’s-eye-view (BEV) representations**, **3D detection**, and **delay-aware multi-node fusion**. CoInfra provides a real-world platform and adverse-weather dataset for robust vehicle–infrastructure cooperation beyond onboard sensing."
    description_zh: "融合相机与激光雷达观测，结合共享**鸟瞰视角（BEV）表征**、**三维目标检测**与**时延感知的多节点融合**。CoInfra 提供真实部署平台与恶劣天气数据集，支持超越车载感知范围的稳健车路协同研究。"
    image: /images/research/coinfra.jpg
    image_size: [2437, 889]
    image_crop: [7, 7, 2424, 876]
    image_alt: CoInfra multi-node LiDAR point clouds and camera views with 3D object annotations around a roundabout.
    image_alt_zh: CoInfra 环岛场景中的多节点激光雷达点云、相机视角与三维目标标注。
    image_credit: CoInfra project
    image_credit_zh: CoInfra 项目
    image_source_url: https://github.com/NingMingHao/CoInfra/blob/main/assets/DatasetExample.jpg
    image_license: CC BY-NC 4.0
    image_license_url: https://creativecommons.org/licenses/by-nc/4.0/
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2507.02245
      - label: Project
        url: https://github.com/NingMingHao/CoInfra
  - id: multi-agent
    title: Learning-based multi-agent collaboration
    image: /images/research/multi-agent.png
    image_size: [1188, 1044]
    image_crop: [19, 9, 1161, 1021]
    image_alt: Vehicle subsystem agents and autonomous racing examples illustrating multi-agent coordination.
    description: "**ADMM-based distributed MPC** coordinates coupled agents with convergence guarantees, while a **learned warm-start** accelerates negotiation. The framework supports plug-and-play control objectives, evaluated through path-tracking simulations and electric-vehicle experiments."
    links:
      - label: Paper · IEEE T-ITS 2025
        url: https://ieeexplore.ieee.org/document/11181563
      - label: Paper · ITSC 2024
        url: https://ieeexplore.ieee.org/document/10919711
      - label: arXiv · T-ITS
        url: https://arxiv.org/abs/2609.12108
      - label: arXiv · ITSC
        url: https://arxiv.org/abs/2609.12142
      - label: Lab project
        url: https://uwaterloo.ca/mechatronic-vehicle-systems-lab/research/vehicle-control-systems/multi-objective-agent-based-mpc
    title_zh: 基于学习的多智能体协作
    description_zh: "基于**交替方向乘子法（ADMM）的分布式模型预测控制**，在收敛保证下协调耦合智能体，并通过**学习型热启动**加速协商。框架支持控制目标的即插即用，以路径跟踪仿真和电动汽车试验验证性能。"
    image_alt_zh: 展示车辆子系统智能体、自动驾驶赛车与多智能体协作的研究图片。
  - id: learning-mpc
    title: Learning-based MPC
    image: /images/research/learning-mpc.png
    image_size: [1526, 1040]
    image_crop: [6, 0, 1514, 1019]
    image_alt: Vehicle tests on a wet surface, data-driven dynamics modeling, and uncertainty-aware MPC constraints.
    description: "**Online Gaussian-process (GP)** learning models unknown dynamics within agent-based MPC. **Multi-step uncertainty prediction** and **stochastic chance constraints** balance adaptability, tracking performance, and safety, supported by real-time data management and validation on physical vehicles."
    links:
      - label: PhD thesis
        url: https://hdl.handle.net/10012/21401
      - label: Paper · IEEE T-ITS 2024
        url: https://ieeexplore.ieee.org/document/10623843
      - label: arXiv
        url: https://arxiv.org/abs/2609.11871
      - label: Lab project
        url: https://uwaterloo.ca/mechatronic-vehicle-systems-lab/research/vehicle-control-systems/learning-agent-based-mpc
    title_zh: 基于学习的模型预测控制
    description_zh: "在智能体模型预测控制中，通过**在线高斯过程（GP）** 学习刻画未知动力学。结合**多步不确定性预测**与**随机机会约束**，兼顾适应能力、跟踪性能与安全，并以实时数据管理和实车试验加以支撑与验证。"
    image_alt_zh: 湿滑路面实车试验、数据驱动动力学建模，以及考虑不确定性的模型预测控制约束。
  - id: f1tenth
    title: "F1TENTH: RL-MPC and World Models for Agile Racing"
    image: /images/research/f1tenth.jpg
    image_size: [791, 318]
    image_crop: [1, 1, 790, 317]
    image_alt: My F1TENTH autonomous racing platform with onboard sensors and mapping views.
    description: "Ongoing research on **RL-MPC** for objective tuning and **action-conditioned world models** for dynamics prediction. Vision and LiDAR observations inform predictive models that support downstream optimization-based planning and control for agile autonomous racing."
    links:
      - label: Platform
        url: https://f1tenth.org/
    title_zh: "F1TENTH：融合 RL-MPC 与世界模型的敏捷竞速"
    description_zh: "正在研究用于控制目标调优的**强化学习与模型预测控制融合方法（RL-MPC）**，以及用于动力学预测的**动作条件世界模型**。结合视觉与激光雷达观测学习预测模型，支撑敏捷自主竞速中下游基于优化的规划与控制。"
    image_alt_zh: 搭载传感器的 F1TENTH 自主赛车平台及其建图画面。
  - id: xlerobot
    title: "XLeRobot: Generative Mobile Manipulation"
    image: /images/research/xlerobot.jpg
    image_size: [728, 318]
    image_crop: [1, 1, 726, 317]
    image_alt: My mobile dual-arm XLeRobot platform and a close-up of its manipulation setup.
    description: "Ongoing exploration of **action-chunking policies**, **vision-language-action (VLA) models**, and **world-action models (WAM)** for generative mobile manipulation. XLeRobot connects multimodal perception with coordinated mobile-base and dual-arm actions."
    links:
      - label: Platform
        url: https://github.com/Vector-Wangel/XLeRobot
    title_zh: "XLeRobot：生成式移动操作"
    description_zh: "正在探索用于生成式移动操作的**动作分块策略**、**视觉—语言—动作（VLA）模型**与**世界—动作模型（WAM）**。以 XLeRobot 为平台，研究从多模态感知到移动底盘与双臂协同动作的映射。"
    image_alt_zh: XLeRobot 移动双臂机器人及其操作装置的近景。
