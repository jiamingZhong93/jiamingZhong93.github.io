vision:
  title: Trustworthy Physical AI
  title_zh: 可信物理人工智能
  learning: Data-driven learning
  learning_zh: 数据驱动学习
  prior: Model-based structure
  prior_zh: 基于模型的结构
  description: "My research focuses on hybrid data-driven and model-based frameworks that formally embed learning within safety-critical control and decision-making architectures. Data-driven methods improve adaptability under uncertainty, while model-based structure incorporates human knowledge as priors and enforces safety, stability, and robustness."
  description_zh: "我的研究聚焦于融合数据驱动与模型方法的混合框架，将学习以形式化方式嵌入安全关键的控制与决策架构。数据驱动方法提升不确定环境下的适应能力，模型结构则融入人类知识先验，并保障安全性、稳定性与鲁棒性。"
  bullets:
    - text: "How can multimodal learning capture the physical dynamics and interactions of complex worlds?"
      text_zh: "如何通过多模态学习，表征复杂世界的物理动力学与交互关系？"
    - text: "How can action-conditioned world models support efficient optimization for downstream tasks of safety-critical decision-making, planning, and control?"
      text_zh: "如何让世界模型刻画动作的影响，为下游安全关键的决策、规划与控制任务提供高效的优化支持？"
    - text: "How can imitation, reinforcement, and self-supervised learning best complement classical model-based methods?"
      text_zh: "如何将模仿学习、强化学习与自监督学习的优势融入经典的基于模型的方法？"

projects:
  - id: articulated-vehicles
    title: Learning-based planning and control for articulated heavy-duty and off-road vehicles
    description: Improving heavy-vehicle safety under challenging road and weather conditions.
    image: /images/research/safetrucks-snow.jpg
    image_alt: An articulated truck driving on a snow-covered forest road, from the SafeTrucks website.
    image_alt_zh: SafeTrucks 官网照片：铰接式卡车行驶在积雪覆盖的林间道路上。
    # Public photo and description: https://safetrucks.fmi.fi/index.php/project-description/
    # Original image: https://safetrucks.fmi.fi/wp-content/uploads/2023/08/rekka2.jpg
    links:
      - label: SafeTrucks project
        url: https://safetrucks.fmi.fi/index.php/project-description/
    title_zh: 面向铰接式重型车辆及越野车辆的学习型规划与控制
    description_zh: 提升重型车辆在复杂道路与天气条件下的行驶安全。
  - id: drivellm
    title: "DriveLLM: Explainable Driving Decisions"
    image: /images/research/drivellm.jpg
    image_alt: WATonobus and driving scenes with pedestrians, snow, and LiDAR sensing from the DriveLLM research overview.
    description: Language-model reasoning with rule-based safety checks for explainable driving decisions, evaluated through WATonobus case studies.
    links:
      - label: Paper · IEEE T-IV
        url: https://ieeexplore.ieee.org/document/10297415
      - label: Project
        url: https://github.com/DriveLLM/DriveLLM
    title_zh: "DriveLLM：可解释驾驶决策"
    description_zh: 将大语言模型推理与基于规则的安全检查相结合，实现可解释的驾驶决策，并通过 WATonobus 案例进行评估。
    image_alt_zh: DriveLLM 研究中的 WATonobus 及行人、积雪和激光雷达感知场景。
  - id: multi-agent
    title: Learning-based multi-agent collaboration
    image: /images/research/multi-agent.jpg
    image_alt: Vehicle subsystem agents and autonomous racing examples illustrating multi-agent coordination.
    description: Cooperating agents and learned negotiation initialization for plug-and-play vehicle control and faster multi-objective MPC.
    links:
      - label: Paper · IEEE T-ITS 2025
        url: https://ieeexplore.ieee.org/document/11181563
      - label: Paper · ITSC 2024
        url: https://ieeexplore.ieee.org/document/10919711
      - label: Lab project
        url: https://uwaterloo.ca/mechatronic-vehicle-systems-lab/research/vehicle-control-systems/multi-objective-agent-based-mpc
    title_zh: 基于学习的多智能体协作
    description_zh: 利用协作智能体与学习驱动的协商初始化，实现即插即用的车辆控制，并加速多目标模型预测控制。
    image_alt_zh: 展示车辆子系统智能体、自动驾驶赛车与多智能体协作的研究图片。
  - id: learning-mpc
    title: Learning-based MPC
    image: /images/research/learning-mpc.jpg
    image_alt: Vehicle tests on a wet surface, data-driven dynamics modeling, and uncertainty-aware MPC constraints.
    description: Online Gaussian-process dynamics learning with stochastic MPC, tested on real vehicles under changing and low-friction conditions.
    links:
      - label: Paper · IEEE T-ITS 2024
        url: https://ieeexplore.ieee.org/document/10623843
      - label: Lab project
        url: https://uwaterloo.ca/mechatronic-vehicle-systems-lab/research/vehicle-control-systems/learning-agent-based-mpc
      - label: PhD thesis
        url: https://hdl.handle.net/10012/21401
    title_zh: 基于学习的模型预测控制
    description_zh: 将在线高斯过程动力学学习与随机模型预测控制相结合，在变化工况及低附着路面上开展实车验证。
    image_alt_zh: 湿滑路面车辆实验、数据驱动动力学建模和考虑不确定性的模型预测控制。
  - id: f1tenth
    title: "F1TENTH: World Models for Agile Racing"
    image: /images/research/f1tenth.jpg
    image_alt: My F1TENTH autonomous racing platform with onboard sensors and mapping views.
    description: Ongoing exploration of multimodal world models for agile planning and control on an autonomous racing platform with vision and LiDAR.
    links:
      - label: Platform
        url: https://f1tenth.org/
    title_zh: "F1TENTH：面向敏捷赛车的世界模型"
    description_zh: 正在探索多模态世界模型，利用配备视觉与激光雷达的自主赛车平台研究敏捷规划与控制。
    image_alt_zh: 搭载传感器的 F1TENTH 自主赛车平台及其建图画面。
  - id: xlerobot
    title: "XLeRobot: Generative Mobile Manipulation"
    image: /images/research/xlerobot.jpg
    image_alt: My mobile dual-arm XLeRobot platform and a close-up of its manipulation setup.
    description: Ongoing work on generative mobile manipulation with action-chunking policies, world-action models, and vision-language-action models.
    links:
      - label: Platform
        url: https://github.com/Vector-Wangel/XLeRobot
    title_zh: "XLeRobot：生成式移动操作"
    description_zh: 正在开展生成式移动操作研究，探索动作分块策略、世界—动作模型以及视觉—语言—动作模型。
    image_alt_zh: XLeRobot 移动双臂机器人及其操作装置的近景。
