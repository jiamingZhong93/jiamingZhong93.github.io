# Six themes, each with short bilingual research labels. List order controls the path.
# 六个主题串联研究历程；在每个主题下维护中英文短标签，顺序由列表决定。
# Methodological labels are shared below; stage keys remain stable for maintenance.
# 方法论标签统一在下方维护；保留 stage 键，方便各主题引用。
title: Research trajectory
title_zh: 研究历程
outlook: "Real-world applications requiring adaptation, generalization, and constraints:"
outlook_zh: "需要适应、泛化并满足约束的实际应用："
applications:
  - text: "Transportation and logistics"
    text_zh: "交通运输与物流"
  - text: "Mining autonomy"
    text_zh: "矿业自主作业"
  - text: "Off-road agriculture"
    text_zh: "越野农业作业"
  - text: "Mobile manipulation"
    text_zh: "移动操作"
stages:
  foundations:
    title: Hybrid foundation
    title_zh: 混合架构基础
  ongoing:
    title: Enhanced learning
    title_zh: 学习能力提升
  frontier:
    title: Frontier exploration
    title_zh: 前沿探索
phases:
  - id: dynamics
    stage: foundations
    title: Dynamics Learning
    title_zh: 动力学学习
    steps:
      - id: low-level-control
        title: Learning-based MPC
        title_zh: 基于学习的 MPC
      - id: residual-dynamics
        title: Stochastic & real-time
        title_zh: 随机性与实时性
      - id: autonomous-racing
        title: EV & AV control
        title_zh: 电动与自动驾驶车辆控制
  - id: interactions
    stage: foundations
    title: Interaction Awareness
    title_zh: 交互感知
    steps:
      - id: system-level-coordination
        title: Learning-based ADMM
        title_zh: 基于学习的 ADMM
      - id: prediction
        title: Fast convergence
        title_zh: 快速收敛
      - id: multi-agent-system
        title: Multi-agent system
        title_zh: 多智能体系统
  - id: decisions
    stage: foundations
    title: Intelligent Decisions
    title_zh: 智能决策
    steps:
      - id: high-level-decision-making
        title: Structured tokenization
        title_zh: 结构化词元编码
      - id: explainable-reasoning
        title: Recursively explainable
        title_zh: 递归可解释
      - id: llm-decisions
        title: DriveLLM, LLM agent
        title_zh: DriveLLM, LLM agent
  - id: imitation
    stage: ongoing
    title: Imitation Control
    title_zh: 模仿学习控制
    steps:
      - id: end-to-end
        title: Multimodal end-to-end
        title_zh: 多模态端到端
      - id: transformer-imitation
        title: Transformer-MPC
        title_zh: Transformer-MPC
      - id: articulated-vehicle-control
        title: Articulated/off-road AVs
        title_zh: 铰接式/越野自动驾驶车辆
  - id: reinforcement
    stage: ongoing
    title: Reinforcement Learning
    title_zh: 强化学习
    steps:
      - id: task-level generalization
        title: RL-MPC / MBRL
        title_zh: RL-MPC / MBRL
      - id: rl-mpc
        title: Task-level generalization
        title_zh: 任务级泛化
      - id: model-based-rl
        title: Roboracer (F1TENTH)
        title_zh: Roboracer 自主赛车
  - id: manipulation
    stage: frontier
    title: Autonomous Operation
    title_zh: 自主操作
    steps:
      - id: physical AGI
        title: Multimodal VLA/WAM
        title_zh: 多模态 VLA/WAM
      - id: latent-space representation
        title: Generalization & scaling
        title_zh: 泛化与规模扩展
      - id: manipulation-world-models
        title: AV + arm (XLeRobot)
        title_zh: 移动底盘+机械臂
