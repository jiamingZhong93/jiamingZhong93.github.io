# Six themes, each with short bilingual research labels. List order controls the path.
# 六个主题串联研究历程；在每个主题下维护中英文短标签，顺序由列表决定。
# Stage captions are shared below; each phase selects one with its stage key.
# 阶段标签统一在下方维护；每个主题通过 stage 选择对应阶段。
title: Research trajectory
title_zh: 研究历程
stages:
  foundations:
    title: Foundations
    title_zh: 研究基础
  ongoing:
    title: Ongoing research
    title_zh: 在研方向
  frontier:
    title: Frontier exploration
    title_zh: 前沿探索
phases:
  - id: dynamics
    stage: foundations
    title: Uncertain dynamics
    title_zh: 不确定动力学
    steps:
      - id: low-level-control
        title: Low-level control
        title_zh: 底层控制
      - id: residual-dynamics
        title: Probabilistic residual
        title_zh: 概率残差
      - id: autonomous-racing
        title: EVs, F1TENTH
        title_zh: 电动汽车、F1TENTH
  - id: interactions
    stage: foundations
    title: Interaction awareness
    title_zh: 交互感知
    steps:
      - id: system-level-coordination
        title: System-level coop.
        title_zh: 系统级协作
      - id: prediction
        title: Interaction learning
        title_zh: 交互学习
      - id: multi-agent-system
        title: Multi-agent system
        title_zh: 多智能体系统
  - id: decisions
    stage: foundations
    title: Intelligent decisions
    title_zh: 智能决策
    steps:
      - id: high-level-decision-making
        title: High-level intelligence
        title_zh: 高层智能
      - id: explainable-reasoning
        title: Explainable reasoning
        title_zh: 可解释推理
      - id: llm-decisions
        title: DriveLLM, LLM agent
        title_zh: DriveLLM、大语言模型智能体
  - id: imitation
    stage: ongoing
    title: Imitation control
    title_zh: 模仿学习控制
    steps:
      - id: end-to-end
        title: End-to-end
        title_zh: 端到端
      - id: transformer-imitation
        title: Transformer
        title_zh: Transformer
      - id: articulated-vehicle-control
        title: Articulated, off-road AVs
        title_zh: 铰接式与越野自动驾驶车辆
  - id: reinforcement
    stage: ongoing
    title: Reinforcement learning
    title_zh: 强化学习
    steps:
      - id: task-level generalization
        title: Task-level generalization
        title_zh: 任务级泛化
      - id: rl-mpc
        title: RL-enhanced MPC
        title_zh: 强化学习增强的 MPC
      - id: model-based-rl
        title: Model-based RL
        title_zh: 基于模型的强化学习
  - id: manipulation
    stage: frontier
    title: Multimodal Operation
    title_zh: 多模态操作
    steps:
      - id: physical AGI
        title: Physical AGI
        title_zh: 物理世界通用人工智能
      - id: latent-space representation
        title: VLA/WAM
        title_zh: VLA/WAM
      - id: manipulation-world-models
        title: AV + arm (XLeRobot)
        title_zh: 自动驾驶车/机械臂(XLeRobot)
