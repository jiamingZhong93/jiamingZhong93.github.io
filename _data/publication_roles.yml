# Keep full, comma-separated author lists in publications.json.
# Show authors through Jiaming, then et al.; retain any later co-first authors.
# List every co-first author in a paper's co_first_authors array, using the same names.
# Other role symbols describe Jiaming's role. Labels also update the legend.
author_name: "J. Zhong"
abbreviate_after_author: true
roles:
  - id: first
    symbol: "†"
    label: "First author"
    label_zh: "第一作者"
  - id: co-first
    symbol: "*"
    label: "Co-first author"
    label_zh: "共同第一作者"
  - id: corresponding
    symbol: "‡"
    label: "Corresponding author"
    label_zh: "通讯作者"
