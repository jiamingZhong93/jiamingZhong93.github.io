# New photos in images/background/ join automatically; metadata is optional.
# One photo on every device. Hover anywhere or long press for both captions; this pauses the timer.
enabled: true
height: "220px"
mobile_height: "150px"
interval: 3000
fade_duration: 1000 # Crossfade in milliseconds, followed by the full interval above.
position: "50% 50%"
mobile_position: "50% 50%"
# title/title_zh name each photo; description/description_zh provide its short details.
# Older caption/caption_zh fields still work as title fallbacks; otherwise the filename is used.
# enabled: false excludes an image from the random rotation.
# Ordinary photos only need position/mobile_position for custom framing.
# crop + source_size isolate a photo inside these existing composite examples.
# Remove BOTH fields when replacing an example with a new standalone photo.
images:
  safetrucks-snow.jpg:
    position: "60% 55%"
    title: "Heavy vehicles in winter"
    title_zh: "冬季重型车辆"
    description: "SafeTrucks research on safer heavy-vehicle control. Photo: SafeTrucks."
    description_zh: "SafeTrucks 重型车辆安全控制研究。图片：SafeTrucks。"
    credit: "Photo: SafeTrucks"
    credit_zh: "图片：SafeTrucks"
    source: "https://safetrucks.fmi.fi/index.php/project-description/"
  f1tenth.jpg:
    crop: "3 3 480 312"
    source_size: [791, 318]
    title: "F1TENTH"
    title_zh: "F1TENTH"
    description: "Agile planning and control with vision and LiDAR."
    description_zh: "结合视觉与激光雷达的敏捷规划与控制。"
  xlerobot.jpg:
    crop: "291 3 434 312"
    source_size: [728, 318]
    title: "XLeRobot"
    title_zh: "XLeRobot"
    description: "Generative mobile manipulation with a dual-arm robot."
    description_zh: "面向双臂机器人的生成式移动操作。"
  # Keep research diagrams in the folder, outside the photo selection.
  drivellm.jpg:
    enabled: false
  learning-mpc.jpg:
    enabled: false
  multi-agent.jpg:
    enabled: false
