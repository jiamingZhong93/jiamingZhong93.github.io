# Only photos configured below enter the carousel. Filenames must be unique.
# Keep matching files in images/background/; photo_ is a naming convention, not a requirement.
# position / mobile_position set the horizontal and vertical focal point.
# Use cover to fill the banner without blurred sidebars; mobile_fit must stay cover.
# Desktop contain is reserved for the explicitly cropped F1TENTH photo.
# Framing is applied in the browser, without cutting the original file.
# Optional subject: [x, y, width, height] with source_size keeps a padded subject
# visible under cover framing; a photo is skipped only when that region cannot fit.
# desktop: false keeps a photo on phones only; leave it unset to allow both layouts.
enabled: true
height: "220px"
mobile_height: "150px"
interval: 3000
info_extra: 1000
fade_duration: 1000
position: "50% 50%"
mobile_position: "50% 50%"
# Prioritize unseen photos across both categories before starting a new round.
# Spread categories through the whole round, with random gaps. Weights give a small earlier-position preference, not a fixed ratio.
category_weights:
  experience: 2
  scenery: 1
