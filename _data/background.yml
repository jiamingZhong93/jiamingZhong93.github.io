# Every supported image in images/background/ joins the pool automatically.
# Refresh picks a new random order; resize keeps that order. No duplicate tiles.
enabled: true
height: "220px"
mobile_height: "150px"
# Approximate tile widths in pixels. Smaller values show more photos.
tile_width: 360
mobile_tile_width: 240
position: "50% 50%"
mobile_position: "50% 50%"
# Optional crop overrides, keyed by filename. New photos do not need an entry.
images:
  xlerobot.jpg:
    position: "50% 45%"
    mobile_position: "65% 45%"
  safetrucks-snow.jpg:
    position: "60% 50%"
