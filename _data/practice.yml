  - enabled: true
    id: practice-electric-vehicle-control
    title: High-performance motion control for electric vehicles
    title_zh: 电动汽车高性能运动控制
    description: "Developed production EV control software at SAIC Motor and NIO, covering **state estimation**, **high-performance all-wheel-drive dynamics control**, and **air and active suspension control**."
    description_zh: "在上汽和蔚来从事量产电动车控制软件开发，涵盖**状态估计**、**高性能四驱动态控制**以及**空气与主动悬架控制**。"
