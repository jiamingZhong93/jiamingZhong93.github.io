    id: practice-delivery-robots
    title: "Delivery Robots — agile interaction with crowds"
    title_zh: "配送机器人：与人群敏捷交互"
    description: "Led **planning and control** development for LoopX’s GoosEX delivery robots, enabling smooth navigation through crowds on the University of Waterloo campus."
    description_zh: "主导 LoopX GoosEX 配送机器人的**规划与控制**研发，实现滑铁卢大学校园人群中的平稳导航。"
    image: /images/practice/delivery-robots.jpg
    image_size: [2276, 1280]
    image_alt: A red GoosEX delivery robot crossing a pedestrian crossing alongside people on the University of Waterloo campus.
    image_alt_zh: 红色 GoosEX 配送机器人与行人一起穿过滑铁卢大学校园的人行横道。
