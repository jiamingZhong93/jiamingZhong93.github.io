title: "Jiaming Zhong"
description: "Jiaming Zhong researches trustworthy physical AI, learning-based control, and multi-agent coordination for mobile autonomy."
repository: "jiamingZhong93/jiamingZhong93.github.io"
url: "https://jiamingzhong93.github.io"
baseurl: ""
author:
  name: "Jiaming Zhong"
  avatar: "/images/avatar.jpg"
  bio: "Associate Research Officer"
  employer: "National Research Council Canada"
  employer_url: "https://nrc.canada.ca/en"
  education: "University of Waterloo · PhD"
  education_url: "https://uwaterloo.ca/"
  googlescholar: "https://scholar.google.com/citations?user=kSAQtOoAAAAJ"
  github: "jiamingZhong93"
  linkedin: "jiaming-zhong"
include: [".htaccess", "_pages", "files"]
exclude: ["docs", "google_scholar_crawler", ".bundle", ".jekyll-assets-cache", ".sass-cache", ".github", "Gemfile", "Gemfile.lock", "README.md", "run_server.sh", "node_modules", "package.json", "package-lock.json", "scripts", "preview.cmd", "preview.sh", "tmp", "vendor", "assets/js/_main.js", "assets/js/plugins", "assets/js/vendor"]
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: America/Toronto
plugins: [jekyll-paginate, jekyll-sitemap, jekyll-gist, jekyll-feed, jekyll-redirect-from]
compress_html:
  clippings: all
  ignore:
    envs: development
